<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentDeck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="xterm.css">
<style>
:root{--bg:#0f1117;--side:#0b0d12;--panel:#161a23;--line:#242a37;--fg:#d7dce6;--dim:#7d8699;--acc:#6ea8fe;--live:#3ecf8e;--warn:#f0b429;--claude:#d98b5f;--codex:#7ec8a4;--doing:#6ea8fe;--wait:#f0b429;--block:#e5534b;--done:#5a6275}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#app{display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#tools{padding:10px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);outline:none}
#q:focus{border-color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.on{background:#1d2a44;border-color:var(--acc)}
button.danger:hover{border-color:#e5534b;color:#e5534b}
.chip{padding:2px 8px;border-radius:11px;font-size:11px;background:transparent}
.chip .n{color:var(--dim);margin-left:3px}
.chip.s-doing.on{border-color:var(--doing)}.chip.s-wait.on{border-color:var(--wait)}.chip.s-block.on{border-color:var(--block)}.chip.s-done.on{border-color:var(--done)}
.chip.tag{border-style:dashed}
#list{flex:1;min-height:0;overflow:auto;padding-bottom:20px}
.grp{padding:8px 12px 4px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--side);cursor:pointer;z-index:1;user-select:none}
.grp:hover{color:var(--fg)}
.grp b{color:var(--fg);font-weight:600}
.grp .cnt{color:var(--dim);margin-left:6px}
.grp i{font-style:normal;padding:0 6px;color:var(--dim)} .grp i:hover{color:var(--acc)}
.it{padding:6px 10px 6px 10px;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:start;border-left:3px solid transparent;position:relative}
.it:hover{background:#12151d}
.it.sel{background:#16203a}
.it.cur{outline:1px solid #2c3f6b;outline-offset:-1px}
.it.st-doing{border-left-color:var(--doing)}.it.st-wait{border-left-color:var(--wait)}.it.st-block{border-left-color:var(--block)}.it.st-done{border-left-color:var(--done)}.it.st-done .t{color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:#3a4152}
.live .dot{background:var(--live);box-shadow:0 0 6px var(--live)}
.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{color:var(--dim);font-size:11px;margin-top:2px;display:flex;gap:5px;align-items:center;overflow:hidden;white-space:nowrap}
.tag{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid}
.tag.claude{color:var(--claude);border-color:var(--claude)} .tag.codex{color:var(--codex);border-color:var(--codex)}
.ut{font-size:10px;padding:0 5px;border-radius:3px;background:#1b2130;color:#9fb0d0}
.mem{color:var(--warn);font-size:11px}
.pin{color:var(--warn)}
.more{position:absolute;right:6px;top:5px;display:none;padding:0 6px;line-height:18px}
.it:hover .more{display:block}.it:hover .mem{display:none}
#status{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#tabs{display:flex;gap:2px;background:var(--side);border-bottom:1px solid var(--line);padding:6px 6px 0;overflow-x:auto;min-height:36px;flex:none}
.tab{padding:6px 12px;border-radius:6px 6px 0 0;background:#141821;color:var(--dim);cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-bottom:none}
.tab.on{background:var(--bg);color:var(--fg)}
.tab.off::before{content:"○ ";color:var(--warn)}
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:44px;flex:none}
#bar .ttl{flex:1;min-width:0}
#bar .ttl div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .ttl div:last-child{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#terms{flex:1;position:relative;min-height:0;overflow:hidden}
.term{position:absolute;inset:0;padding:6px 0 0 8px;display:none;overflow:hidden}
.term.on{display:block}
#empty,#preview{position:absolute;inset:0;overflow:auto}
#empty{display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;line-height:1.9}
#preview{display:none;padding:22px 28px;background:var(--bg);z-index:2}
#preview h2{margin:0 0 4px;font-size:16px}
#preview .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
#preview .msg{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--panel);white-space:pre-wrap;word-break:break-word;line-height:1.55;max-width:900px}
#preview .msg.user{border-left:3px solid var(--acc)}#preview .msg.assistant{border-left:3px solid #3a4152}
#preview .msg b{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;font-weight:500}
#preview .go{padding:9px 20px;font-size:14px;background:#1d2a44;border-color:var(--acc);margin:6px 0 14px}
kbd{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px}
#toast{position:fixed;bottom:18px;right:18px;background:#3a1d1d;border:1px solid #e5534b;color:#ffb4ae;padding:10px 14px;border-radius:8px;display:none;max-width:420px;z-index:99}
#pop{position:fixed;z-index:50;background:#1a1f2b;border:1px solid #33405c;border-radius:10px;padding:12px;width:290px;display:none;box-shadow:0 8px 30px #000a}
#pop label{display:block;color:var(--dim);font-size:11px;margin:8px 0 4px}
#pop input[type=text]{width:100%;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);outline:none}
#pop .sts{display:flex;gap:5px;flex-wrap:wrap}
#pop .sts button.on{background:#1d2a44}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="tools">
      <input id="q" placeholder="搜索标题 / 目录 / 标签   ⌘K" autocomplete="off" spellcheck="false">
      <div class="row" id="views">
        <button id="vFlat" title="按最近活动平铺">最近</button>
        <button id="vGrp" title="按项目目录分组">按项目</button>
        <button id="collapse" title="全部折叠 / 展开（按项目视图）">折叠</button>
        <button id="tmp" title="显示 /tmp、/var/folders 等临时目录下的会话">临时目录</button>
        <span style="flex:1"></span>
        <button id="nClaude" title="在所选项目目录新建 Claude 会话">＋ Claude</button>
        <button id="nCodex" title="在所选项目目录新建 Codex 会话">＋ Codex</button>
      </div>
      <div class="row" id="chips"></div>
      <div class="row" id="tagchips"></div>
    </div>
    <div id="list"></div>
    <div id="status"><span id="stLive"></span><span id="stMem"></span></div>
  </div>
  <div id="main">
    <div id="tabs"></div>
    <div id="bar" style="display:none">
      <div class="ttl"><div id="bTitle"></div><div id="bCwd"></div></div>
      <button id="fMinus" title="终端字体变小 (⌘-)">A−</button><button id="fPlus" title="终端字体变大 (⌘+)">A＋</button>
      <button id="bIde" title="用 IDE 打开该工作目录">在 IDE 打开</button>
      <button id="bSleep" class="danger" title="结束进程释放内存；会话保留，随时可恢复">休眠</button>
    </div>
    <div id="terms"><div id="preview"></div><div id="empty"><div>从左侧选择一个会话<br>双击/回车 = 恢复并接入 &nbsp;·&nbsp; 关闭本窗口不会中断运行中的会话<br><kbd>⌘K</kbd> 搜索 &nbsp; <kbd>⌘[</kbd><kbd>⌘]</kbd> 切换标签 &nbsp; <kbd>⌘+</kbd><kbd>⌘-</kbd> 终端字体 &nbsp; <kbd>⌘J</kbd> 回到列表</div></div></div>
  </div>
</div>
<div id="toast"></div>
<div id="pop"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-webgl.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('ad.'+k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem('ad.'+k,JSON.stringify(v))}catch(_){}}};
const st={sessions:[],byKey:{},q:'',filter:LS.get('filter','all'),tagSel:LS.get('tagSel',[]),view:LS.get('view','flat'),showTmp:LS.get('showTmp',false),
  collapsed:LS.get('collapsed',{}),font:LS.get('font',15),allCollapsed:false,sel:null,open:[],cur:null,terms:{},preview:null,showOld:{},flatLimit:150,raw:''};
const key=s=>s.provider+':'+s.id;
const STATUS={doing:'进行中',wait:'等我',block:'阻塞',done:'完成'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'X-AD':'1','Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||r.statusText);
  return j;
}
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';if(s<86400*30)return Math.floor(s/86400)+' 天前';return new Date(t).toLocaleDateString()}
const isTmp=c=>/^\/(private\/)?(tmp|var\/folders)\b/.test(c)||/^\/private\/var\//.test(c);
const title=s=>s.alias||s.title;
const baseName=c=>c.split('/').filter(Boolean).pop()||c;
const shortPath=c=>c.replace(/^\/Users\/[^/]+/,'~');

async function refresh(force){
  let raw;
  try{raw=JSON.stringify(await api('/api/sessions'))}catch(e){return toast('刷新失败: '+e.message)}
  if(!force&&raw===st.raw)return;           // nothing changed: leave the DOM alone
  st.raw=raw;st.sessions=JSON.parse(raw);st.byKey={};for(const s of st.sessions)st.byKey[key(s)]=s;
  for(const k of st.open){const s=st.byKey[k],t=st.terms[k];if(t&&s&&!s.live&&!t.off)t.off=true}
  render();
}
function matchFilter(s){
  const f=st.filter;
  if(f==='pin'&&!s.pinned)return false;
  if(f==='live'&&!s.live)return false;
  if(STATUS[f]&&s.status!==f)return false;
  if(st.tagSel.length&&!st.tagSel.every(t=>(s.tags||[]).includes(t)))return false;
  if(!st.showTmp&&isTmp(s.cwd)&&!s.live)return false;
  const q=st.q.trim().toLowerCase();
  if(q&&!(title(s)+' '+s.title+' '+s.cwd+' '+s.provider+' '+(s.tags||[]).join(' ')+' '+(STATUS[s.status]||'')).toLowerCase().includes(q))return false;
  return true;
}
function counts(){
  const c={all:0,pin:0,live:0,doing:0,wait:0,block:0,done:0},tags={};
  for(const s of st.sessions){
    if(!st.showTmp&&isTmp(s.cwd)&&!s.live)continue;
    c.all++;if(s.pinned)c.pin++;if(s.live)c.live++;if(s.status)c[s.status]++;
    for(const t of s.tags||[])tags[t]=(tags[t]||0)+1;
  }
  return {c,tags};
}
function renderChips(){
  const {c,tags}=counts();
  const defs=[['all','全部'],['pin','★ 置顶'],['live','● 运行中'],['doing','进行中'],['wait','等我'],['block','阻塞'],['done','完成']];
  const el=$('#chips');el.textContent='';
  for(const [k,l] of defs){
    if(k!=='all'&&k!=='live'&&!c[k]&&st.filter!==k)continue;
    const b=document.createElement('button');b.className='chip s-'+k+(st.filter===k?' on':'');
    b.innerHTML='<span></span><span class="n"></span>';b.firstChild.textContent=l;b.lastChild.textContent=c[k];
    b.onclick=()=>{st.filter=k;LS.set('filter',k);render()};el.appendChild(b);
  }
  const te=$('#tagchips');te.textContent='';
  for(const t of Object.keys(tags).sort()){
    const b=document.createElement('button');b.className='chip tag'+(st.tagSel.includes(t)?' on':'');
    b.innerHTML='<span></span><span class="n"></span>';b.firstChild.textContent='#'+t;b.lastChild.textContent=tags[t];
    b.onclick=()=>{st.tagSel=st.tagSel.includes(t)?st.tagSel.filter(x=>x!==t):[...st.tagSel,t];LS.set('tagSel',st.tagSel);render()};te.appendChild(b);
  }
}
function render(){
  $('#vFlat').classList.toggle('on',st.view==='flat');$('#vGrp').classList.toggle('on',st.view==='grp');
  $('#tmp').classList.toggle('on',st.showTmp);$('#collapse').style.display=st.view==='grp'?'':'none';
  renderChips();
  const el=$('#list'),top=el.scrollTop;el.textContent='';
  const list=st.sessions.filter(matchFilter);
  st.flat=[];
  const frag=document.createDocumentFragment();
  const pinned=list.filter(s=>s.pinned);
  const q=st.q.trim();
  if(pinned.length&&st.filter!=='pin'){frag.appendChild(header('★ 置顶',pinned.length));for(const s of pinned){st.flat.push(s);frag.appendChild(row(s,true))}}
  const rest=st.filter==='pin'?[]:list.filter(s=>!s.pinned);
  const body=st.filter==='pin'?list:rest;
  if(st.view==='flat'){
    if(!pinned.length||st.filter==='pin'){}else if(rest.length)frag.appendChild(header('最近',rest.length));
    const lim=q?1e9:st.flatLimit;
    for(const s of body.slice(0,lim)){st.flat.push(s);frag.appendChild(row(s,true))}
    if(body.length>lim){const m=document.createElement('div');m.className='m';m.style.cssText='padding:8px 34px;cursor:pointer';m.textContent='显示更多（还有 '+(body.length-lim)+' 个）…';m.onclick=()=>{st.flatLimit+=150;render()};frag.appendChild(m)}
  }else{
    const g=new Map();for(const s of body){if(!g.has(s.cwd))g.set(s.cwd,[]);g.get(s.cwd).push(s)}
    for(const [cwd,items] of g){
      const open=isOpen(cwd,items);
      frag.appendChild(header(baseName(cwd),items.length,cwd,open));
      if(!open)continue;
      for(const s of items){st.flat.push(s);frag.appendChild(row(s,false))}
    }
  }
  if(!list.length){const m=document.createElement('div');m.className='m';m.style.padding='20px';m.textContent='没有匹配的会话';frag.appendChild(m)}
  el.appendChild(frag);el.scrollTop=top;
  const live=st.sessions.filter(s=>s.live);
  $('#stLive').textContent='运行中 '+live.length+' / 共 '+st.sessions.length;
  $('#stMem').textContent='agent 占用 '+live.reduce((a,s)=>a+(s.rss_mb||0),0)+' MB';
  renderTabs();
}
// default: expand a project if something in it is live/pinned/recent; user choice wins
function isOpen(cwd,items){
  if(st.q.trim()||st.filter!=='all'||st.tagSel.length)return true;
  if(cwd in st.collapsed)return !st.collapsed[cwd];
  return items.some(s=>s.live||s.pinned||Date.now()-new Date(s.updated)<2*86400e3);
}
function header(name,n,cwd,open){
  const h=document.createElement('div');h.className='grp';
  const arrow=cwd?(open?'▾ ':'▸ '):'';
  h.innerHTML='<span><span class="a"></span><b></b><span class="cnt"></span> <span class="p"></span></span><i></i>';
  h.querySelector('.a').textContent=arrow;h.querySelector('b').textContent=name;h.querySelector('.cnt').textContent=n;
  if(cwd){h.querySelector('.p').textContent=shortPath(cwd);h.dataset.cwd=cwd;h.title=cwd;h.querySelector('i').textContent='＋';h.querySelector('i').title='在此目录新建会话'}
  return h;
}
function row(s,showDir){
  const k=key(s),d=document.createElement('div');
  d.className='it'+(s.live?' live':'')+(s.status?' st-'+s.status:'')+(st.sel&&st.sel===k?' sel':'')+(st.cur===k?' cur':'');
  d.dataset.k=k;
  d.innerHTML='<span class="dot"></span><div><div class="t"></div><div class="m"></div></div><span class="mem"></span><button class="more" title="标记 / 标签 / 置顶 / 改名">⋯</button>';
  d.querySelector('.t').textContent=(s.pinned?'★ ':'')+title(s);
  const m=d.querySelector('.m');
  const add=(cls,txt)=>{const e=document.createElement('span');e.className=cls;e.textContent=txt;m.appendChild(e)};
  add('tag '+s.provider,s.provider);
  if(s.status)add('ut',STATUS[s.status]);
  for(const t of s.tags||[])add('ut','#'+t);
  add('',ago(s.updated));
  if(showDir)add('',baseName(s.cwd));
  d.querySelector('.mem').textContent=s.live&&s.rss_mb?s.rss_mb+' MB':'';
  return d;
}
// ---- one delegated handler: nodes are rebuilt freely, clicks never get lost ----
$('#list').addEventListener('click',e=>{
  const g=e.target.closest('.grp');
  if(g&&g.dataset.cwd){
    if(e.target.tagName==='I'){return newSession('claude',g.dataset.cwd)}
    const cwd=g.dataset.cwd,items=st.sessions.filter(s=>s.cwd===cwd);
    st.collapsed[cwd]=isOpen(cwd,items.filter(matchFilter));LS.set('collapsed',st.collapsed);render();return;
  }
  const r=e.target.closest('.it');if(!r)return;
  const s=st.byKey[r.dataset.k];if(!s)return;
  if(e.target.classList.contains('more')){openPop(s,e.target);return}
  select(s);
});
$('#list').addEventListener('dblclick',e=>{const r=e.target.closest('.it');if(r&&!e.target.classList.contains('more')){const s=st.byKey[r.dataset.k];if(s)openSession(s)}});
$('#list').addEventListener('contextmenu',e=>{const r=e.target.closest('.it');if(r){e.preventDefault();const s=st.byKey[r.dataset.k];if(s)openPop(s,r)}});
// click = look at it. Live: attach right away. Dormant: show preview, no process started.
function select(s){
  st.sel=key(s);
  if(s.live)openSession(s);else showPreview(s);
  render();
}
async function showPreview(s){
  st.preview=key(s);$('#empty').style.display='none';$('#preview').style.display='block';
  for(const v of Object.values(st.terms))v.el.classList.remove('on');
  st.cur=null;
  const p=$('#preview');p.textContent='';
  const h=document.createElement('h2');h.textContent=title(s);p.appendChild(h);
  const sub=document.createElement('div');sub.className='sub';sub.textContent=s.provider+' · '+shortPath(s.cwd)+' · '+ago(s.updated)+' · 已休眠（未占用内存）';p.appendChild(sub);
  const go=document.createElement('button');go.className='go';go.textContent='▶ 恢复会话并接入 (Enter)';go.onclick=()=>openSession(s);p.appendChild(go);
  const ide=document.createElement('button');ide.style.marginLeft='8px';ide.textContent='在 IDE 打开目录';ide.onclick=()=>api('/api/ide',{cwd:s.cwd}).catch(e=>toast(e.message));p.appendChild(ide);
  const box=document.createElement('div');box.className='sub';box.textContent='加载最近对话…';p.appendChild(box);
  try{
    const msgs=await api('/api/preview?provider='+s.provider+'&id='+encodeURIComponent(s.id));
    if(st.preview!==key(s))return;
    box.remove();
    if(!msgs.length){const e=document.createElement('div');e.className='sub';e.textContent='（没有可预览的文本消息）';p.appendChild(e)}
    for(const m of msgs){const d=document.createElement('div');d.className='msg '+m.role;const b=document.createElement('b');b.textContent=m.role==='user'?'你':'Agent';d.appendChild(b);d.appendChild(document.createTextNode(m.text));p.appendChild(d)}
  }catch(e){box.textContent='预览失败: '+e.message}
  renderTabs();
}
function hidePreview(){st.preview=null;$('#preview').style.display='none'}
// ---- tabs / terminals ----
function renderTabs(){
  const el=$('#tabs');el.textContent='';
  for(const k of st.open){
    const s=st.byKey[k];if(!s)continue;
    const t=document.createElement('div');t.className='tab'+(st.cur===k?' on':'')+(st.terms[k]&&st.terms[k].off?' off':'');
    t.textContent=title(s);t.title=s.cwd+'  (中键关闭标签)';t.onclick=()=>show(k);
    t.onauxclick=ev=>{ev.preventDefault();closeTab(k)};
    el.appendChild(t);
  }
  const s=st.byKey[st.cur]||(st.preview&&st.byKey[st.preview]);
  $('#bar').style.display=s?'flex':'none';
  if(s){$('#bTitle').textContent=title(s);$('#bCwd').textContent=shortPath(s.cwd)+(s.live?'  ·  '+(s.rss_mb||0)+' MB':'  ·  已休眠');$('#bSleep').disabled=!s.live}
}
async function openSession(s){
  try{
    const r=s.live?{tmux:s.tmux}:await api('/api/resume',{provider:s.provider,id:s.id});
    attach(s,r.tmux);
    refresh();
  }catch(e){toast(e.message)}
}
async function newSession(provider,cwd){
  if(!cwd){const c=st.sel&&st.byKey[st.sel];cwd=c&&c.cwd}
  if(!cwd){toast('先在左侧选中一个会话或项目');return}
  try{
    const r=await api('/api/new',{provider,cwd});
    await refresh(true);
    const s=st.sessions.find(x=>x.tmux===r.tmux)||{provider,id:r.tmux,title:'新会话',cwd,live:true,tmux:r.tmux};
    attach(s,r.tmux);
  }catch(e){toast(e.message)}
}
function attach(s,tmux){
  const k=key(s);
  if(!st.open.includes(k))st.open.push(k);
  let t=st.terms[k];
  if(t&&t.off){destroyTerm(k);t=null}
  if(!t){
    const el=document.createElement('div');el.className='term';$('#terms').appendChild(el);
    const term=new Terminal({fontSize:st.font,scrollback:2000,cursorBlink:true,allowProposedApi:true,theme:{background:'#0f1117'},fontFamily:'"SF Mono", Menlo, Monaco, "PingFang SC", "Courier New", monospace'});
    const fit=new FitAddon.FitAddon();term.loadAddon(fit);
    // Unicode 11 widths: CJK / box-drawing / symbols take the same cells as in iTerm2,
    // otherwise claude's side panels (│ borders) drift line by line.
    term.loadAddon(new Unicode11Addon.Unicode11Addon());term.unicode.activeVersion='11';
    el.classList.add('on');            // must be visible while xterm measures itself
    term.open(el);
    try{ // GPU renderer: cell-exact glyph placement and much faster scrolling than the DOM renderer
      const gl=new WebglAddon.WebglAddon();gl.onContextLoss(()=>gl.dispose());term.loadAddon(gl);
    }catch(_){}
    try{fit.fit()}catch(_){}
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/term?name='+encodeURIComponent(tmux));
    ws.binaryType='arraybuffer';
    const enc=new TextEncoder();
    ws.onopen=()=>{try{fit.fit()}catch(_){}ws.send(JSON.stringify({cols:term.cols,rows:term.rows}))};
    ws.onmessage=e=>term.write(new Uint8Array(e.data));
    ws.onclose=()=>{const x=st.terms[k];if(x&&x.ws===ws){x.off=true;term.write('\r\n\x1b[33m[已断开：会话仍在后台运行，点击标签重新接入]\x1b[0m\r\n');renderTabs()}};
    term.onData(d=>{if(ws.readyState===1)ws.send(enc.encode(d))});
    term.onResize(({cols,rows})=>{if(ws.readyState===1)ws.send(JSON.stringify({cols,rows}))});
    term.attachCustomKeyEventHandler(e=>!(e.metaKey&&['k','j','[',']','w','ArrowUp','ArrowDown','=','+','-','0'].includes(e.key)));
    t=st.terms[k]={term,fit,ws,el,s,tmux,off:false};
    new ResizeObserver(()=>{if(el.classList.contains('on'))try{fit.fit()}catch(_){}}).observe(el);
  }
  show(k);
}
function show(k){
  const t=st.terms[k];
  if(t&&t.off){const s=t.s;destroyTerm(k);return openSession(s)}
  hidePreview();st.cur=k;$('#empty').style.display='none';
  for(const [x,v] of Object.entries(st.terms))v.el.classList.toggle('on',x===k);
  const v=st.terms[k];if(v){requestAnimationFrame(()=>{try{v.fit.fit();v.term.refresh(0,v.term.rows-1)}catch(_){}v.term.focus()})}
  st.sel=k;renderTabs();
  for(const n of document.querySelectorAll('.it.cur'))n.classList.remove('cur');
  const n=document.querySelector('.it[data-k="'+CSS.escape(k)+'"]');if(n)n.classList.add('cur');
}
function destroyTerm(k){const t=st.terms[k];if(!t)return;try{t.ws.close()}catch(_){}t.term.dispose();t.el.remove();delete st.terms[k]}
function closeTab(k){ // only detaches; the agent keeps running
  destroyTerm(k);st.open=st.open.filter(x=>x!==k);
  if(st.cur===k){st.cur=st.open[st.open.length-1]||null;if(st.cur)show(st.cur);else $('#empty').style.display='flex'}
  renderTabs();
}
// ---- annotate popover ----
function openPop(s,anchor){
  const p=$('#pop'),k=key(s);p.textContent='';p.style.display='block';
  const cur={status:s.status||'',tags:[...(s.tags||[])],pinned:!!s.pinned,alias:s.alias||''};
  const save=async()=>{try{await api('/api/meta',{provider:s.provider,id:s.id,...cur});await refresh(true)}catch(e){toast(e.message)}};
  const h=document.createElement('div');h.style.cssText='font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';h.textContent=title(s);p.appendChild(h);
  const lab=t=>{const l=document.createElement('label');l.textContent=t;p.appendChild(l)};
  lab('状态');
  const sts=document.createElement('div');sts.className='sts';p.appendChild(sts);
  const drawSts=()=>{sts.textContent='';for(const [v,l] of [['','无'],...Object.entries(STATUS)]){const b=document.createElement('button');b.textContent=l;if(cur.status===v)b.className='on';b.onclick=()=>{cur.status=v;drawSts();save()};sts.appendChild(b)}};drawSts();
  lab('标签（逗号分隔，回车保存）');
  const ti=document.createElement('input');ti.type='text';ti.value=cur.tags.join(', ');ti.placeholder='例如：支付, 待发版';p.appendChild(ti);
  ti.onkeydown=e=>{if(e.key==='Enter'){cur.tags=ti.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);save();closePop()}};
  lab('显示名称（留空用原标题）');
  const ai=document.createElement('input');ai.type='text';ai.value=cur.alias;p.appendChild(ai);
  ai.onkeydown=e=>{if(e.key==='Enter'){cur.alias=ai.value;save();closePop()}};
  const row=document.createElement('div');row.className='row';row.style.marginTop='10px';p.appendChild(row);
  const pin=document.createElement('button');pin.textContent=cur.pinned?'★ 已置顶（点击取消）':'☆ 置顶';pin.onclick=()=>{cur.pinned=!cur.pinned;save();closePop()};row.appendChild(pin);
  const ok=document.createElement('button');ok.textContent='保存';ok.onclick=()=>{cur.tags=ti.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);cur.alias=ai.value;save();closePop()};row.appendChild(ok);
  const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(r.left+10,innerWidth-310)+'px';p.style.top=Math.min(r.bottom+4,innerHeight-p.offsetHeight-10)+'px';
  setTimeout(()=>ti.focus(),0);
}
function closePop(){$('#pop').style.display='none'}
addEventListener('mousedown',e=>{if(!e.target.closest('#pop')&&!e.target.classList.contains('more'))closePop()});
// ---- terminal font size: ⌘+ / ⌘- / ⌘0, remembered ----
function setFont(n){
  st.font=Math.max(10,Math.min(30,n));LS.set('font',st.font);
  for(const [k,t] of Object.entries(st.terms)){
    t.term.options.fontSize=st.font;
    if(k===st.cur)requestAnimationFrame(()=>{try{t.fit.fit()}catch(_){}});
  }
  toast.h&&clearTimeout(toast.h);const tt=$('#toast');tt.style.cssText+=';background:#1b2130;border-color:#33405c;color:#d7dce6';tt.textContent='终端字体 '+st.font+'px  (⌘0 恢复 15)';tt.style.display='block';toast.h=setTimeout(()=>{tt.style.display='none';tt.style.background='';tt.style.borderColor='';tt.style.color=''},1200);
}
$('#fMinus').onclick=()=>setFont(st.font-1);
$('#fPlus').onclick=()=>setFont(st.font+1);
// ---- toolbar ----
$('#bSleep').onclick=async()=>{
  const s=st.byKey[st.cur];if(!s||!s.live)return;
  try{await api('/api/sleep',{tmux:s.tmux});const t=st.terms[st.cur];if(t)t.off=true;await refresh(true)}catch(e){toast(e.message)}
};
$('#bIde').onclick=async()=>{const s=st.byKey[st.cur]||st.byKey[st.preview];if(s)try{await api('/api/ide',{cwd:s.cwd})}catch(e){toast(e.message)}};
$('#vFlat').onclick=()=>{st.view='flat';LS.set('view','flat');render()};
$('#vGrp').onclick=()=>{st.view='grp';LS.set('view','grp');render()};
$('#tmp').onclick=()=>{st.showTmp=!st.showTmp;LS.set('showTmp',st.showTmp);render()};
$('#collapse').onclick=()=>{
  st.allCollapsed=!st.allCollapsed;
  for(const s of st.sessions)st.collapsed[s.cwd]=st.allCollapsed;
  LS.set('collapsed',st.collapsed);$('#collapse').textContent=st.allCollapsed?'展开':'折叠';render();
};
$('#nClaude').onclick=()=>newSession('claude');
$('#nCodex').onclick=()=>newSession('codex');
// ---- keyboard: type to filter, arrows to move, Enter to open ----
function move(d){
  const f=st.flat||[];if(!f.length)return;
  let i=f.findIndex(s=>st.sel&&key(s)===st.sel);i=i<0?(d>0?0:f.length-1):Math.max(0,Math.min(f.length-1,i+d));
  st.sel=key(f[i]);
  const s=f[i];                                    // moving onto a live session previews it live; dormant ones show their transcript
  if(s.live){hidePreview()}
  render();
  const n=document.querySelector('.it.sel');if(n)n.scrollIntoView({block:'nearest'});
  if(s.live)openSession(s);else showPreview(s);
}
$('#q').oninput=e=>{st.q=e.target.value;render()};
$('#q').onkeydown=e=>{
  if(e.key==='ArrowDown'){e.preventDefault();move(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
  else if(e.key==='Enter'){const s=st.byKey[st.sel]||(st.flat||[])[0];if(s)openSession(s)}
  else if(e.key==='Escape'){if(st.q){st.q='';e.target.value='';render()}else{e.target.blur();const t=st.terms[st.cur];if(t)t.term.focus()}}
};
addEventListener('keydown',e=>{
  if(!e.metaKey)return;
  if(e.key==='k'||e.key==='j'){e.preventDefault();$('#q').focus();$('#q').select()}
  else if(e.key==='['||e.key===']'){e.preventDefault();const i=st.open.indexOf(st.cur);if(st.open.length)show(st.open[(i+(e.key===']'?1:-1)+st.open.length)%st.open.length])}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();move(e.key==='ArrowDown'?1:-1)}
  else if(e.key==='='||e.key==='+'){e.preventDefault();setFont(st.font+1)}
  else if(e.key==='-'){e.preventDefault();setFont(st.font-1)}
  else if(e.key==='0'){e.preventDefault();setFont(15)}
});
refresh(true);setInterval(()=>refresh(false),4000);$('#q').focus();

</script>
</body>
